sections:
  - key: site
    label: Site
    elements:
      - type: text
        key: siteUrl
        label: Site URL
        help: >-
          Optional. Leave blank to use the site address set in CMS Settings > Applications - needed only when
          this CMS serves several sites, to choose which one the redirects apply to. A full https:// address,
          e.g. https://www.example.com. Destinations are checked and opened there, and the site is asked which
          redirects are live.
      - type: button
        label: Save
        action: saveSite
        style: primary
  - key: graph
    label: Optimizely Graph
    elements:
      - type: secret
        key: singleKey
        label: Single key
        help: >-
          The single key from CMS Settings > API Keys. It is used to read the published redirects and the
          addresses of published pages. Leave blank to keep the saved one.
      - type: button
        label: Save
        action: saveGraph
        style: primary
  - key: cms
    label: CMS API client
    elements:
      - type: text
        key: clientId
        label: Client ID
        help: >-
          From CMS Settings > API Keys, for an API client with content write access: adding, enabling or
          disabling a redirect publishes content. It also reads the site addresses in Settings > Applications.
          The CMS history shows this client as the author, not the editor.
      - type: secret
        key: clientSecret
        label: Client secret
        help: Shown once when the API client is created. Leave blank to keep the saved one.
      - type: button
        label: Save
        action: saveCms
        style: primary
