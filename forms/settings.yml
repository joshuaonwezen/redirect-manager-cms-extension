sections:
  - key: site
    label: Site
    elements:
      - type: text
        key: siteUrl
        label: Site URL
        help: >-
          The website this CMS publishes to, starting with https://, e.g. https://optimizely-onboarding.vercel.app.
          Destinations are checked and opened there, and the site is asked which redirects are live.
      - type: button
        label: Save
        action: saveSite
        style: primary
  - key: graph
    label: Optimizely Graph
    elements:
      - type: secret
        key: singleKey
        label: Single key
        help: >-
          The single key from CMS > Settings > API Keys. It is used to read the published redirects and the
          addresses of published pages. Leave blank to keep the saved one.
      - type: button
        label: Save
        action: saveGraph
        style: primary
  - key: cms
    label: CMS API client
    elements:
      - type: text
        key: clientId
        label: Client ID
        help: >-
          From CMS > Settings > API Keys, for a key that can change content: adding, enabling or disabling
          a redirect publishes content. The CMS history shows this key as the author, not the editor.
      - type: secret
        key: clientSecret
        label: Client secret
        help: Shown once when the API key is created. Leave blank to keep the saved one.
      - type: button
        label: Save
        action: saveCms
        style: primary
